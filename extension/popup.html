<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Conspector</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 13px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      button {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary {
        background: #4b5563;
      }
      button.danger {
        background: #b91c1c;
      }
      #serverStatus,
      #recStatus,
      #jobStatus,
      #hint {
        margin-top: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        background: #f3f4f6;
        word-break: break-word;
      }
      #hint {
        font-size: 12px;
        color: #4b5563;
      }
      #serverStatus.ok,
      #recStatus.ok {
        background: #dcfce7;
        color: #166534;
      }
      #serverStatus.bad,
      #recStatus.bad {
        background: #fee2e2;
        color: #991b1b;
      }
      #targetBox {
        margin: 8px 0;
        padding: 8px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
      }
      #targetTitle {
        font-weight: 600;
        margin-bottom: 2px;
      }
      #targetUrl {
        color: #4b5563;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Conspector</h1>

    <label for="serverUrl">Адрес сервера</label>
    <input id="serverUrl" type="text" spellcheck="false" />
    <button id="save" type="button">Сохранить</button>
    <div id="serverStatus">Проверка сервера…</div>

    <label for="tabSelect" style="margin-top: 12px">Вкладка для записи (что переводить)</label>
    <select id="tabSelect"></select>
    <div class="row">
      <button id="refreshTabs" class="secondary" type="button">Обновить список</button>
    </div>

    <label for="captureUrlPattern">Фильтр URL (необязательно)</label>
    <input id="captureUrlPattern" type="text" spellcheck="false" placeholder="подстрока URL, иначе любая" />

    <div id="targetBox">
      <div id="targetTitle">Цель не выбрана</div>
      <div id="targetUrl">—</div>
    </div>

    <div class="row" style="margin-top: 12px">
      <button id="start" type="button">Старт</button>
      <button id="stop" class="danger" type="button" disabled>Стоп</button>
    </div>
    <div id="recStatus">Не записывает</div>
    <div id="jobStatus" hidden></div>
    <div id="hint">
      Спикеры (кто говорит) и лог по секундам появятся в milestone D. Сейчас пишется только звук вкладки.
      Нужен запущенный сервер и вкладка http(s) со звуком (не chrome://).
    </div>

    <script type="module" src="/popup.ts"></script>
  </body>
</html>
