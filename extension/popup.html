<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Conspector</title>
    <link rel="stylesheet" href="/popup.css" />
  </head>
  <body class="popup">
    <header class="popup__header">
      <h1 class="popup__brand">Conspector</h1>
    </header>

    <section class="popup__section" aria-labelledby="server-heading">
      <label id="server-heading" for="serverUrl">Адрес сервера</label>
      <input id="serverUrl" type="url" spellcheck="false" autocomplete="off" />
      <div class="popup__row">
        <button id="save" type="button">Сохранить</button>
      </div>
      <div id="serverStatus" class="status" role="status">Проверка сервера…</div>
    </section>

    <section class="popup__section" aria-labelledby="tab-heading">
      <label id="tab-heading" for="tabSelect">Вкладка для записи</label>
      <select id="tabSelect"></select>
      <div class="popup__row">
        <button id="refreshTabs" class="secondary" type="button">Обновить список</button>
      </div>

      <label for="captureUrlPattern">Фильтр URL (необязательно)</label>
      <input
        id="captureUrlPattern"
        type="text"
        spellcheck="false"
        placeholder="подстрока URL, иначе любая"
        autocomplete="off"
      />

      <div class="popup__target" id="targetBox">
        <div class="popup__target-title" id="targetTitle">Цель не выбрана</div>
        <div class="popup__target-url" id="targetUrl">—</div>
      </div>
    </section>

    <section class="popup__section" aria-labelledby="rec-heading">
      <h2 id="rec-heading" class="visually-hidden">Запись</h2>
      <div class="popup__row">
        <button id="start" type="button">Старт</button>
        <button id="stop" class="danger" type="button" disabled>Стоп</button>
        <button
          id="micToggle"
          class="secondary"
          type="button"
          disabled
          aria-pressed="false"
          title="Во время записи: выключить или снова включить микрофон в миксе (звук вкладки пишется всегда)"
        >
          Микрофон: вкл
        </button>
      </div>
      <div id="recStatus" class="status" role="status">Не записывает</div>
      <div id="jobStatus" class="status" hidden></div>
      <div class="popup__row">
        <button
          id="openConspect"
          class="secondary"
          type="button"
          disabled
          title="Доступно после Стоп, когда сервер закончит Whisper+Qwen"
        >
          Открыть конспект.md
        </button>
      </div>
    </section>

    <aside class="popup__hint">
      <strong>Кто что делает:</strong> Старт/Стоп — запись в браузере. Кнопка «Микрофон»
      во время записи отключает/включает ваш голос в миксе (вкладка пишется всегда). После Стоп
      <em>локальный сервер</em> сам: Whisper → Qwen → <code>conspect.md</code>.
    </aside>

    <script type="module" src="/popup.ts"></script>
  </body>
</html>
